services:
  postgres:
    image: postgres:17.4
    container_name: chatty_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-chatty_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: chatty_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "5051:80"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chatty_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=False
      - DEBUG=False
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-100000000}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sklearn-tfidf}
    depends_on:
      - postgres
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:dev-ollama
    container_name: open-webui
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change_me}
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
