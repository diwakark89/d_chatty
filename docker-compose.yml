version: '3.8'

services:
  postgres:
    image: postgres:17.4
    container_name: chatty_postgres
    restart: always
    environment:
      POSTGRES_USER: chatty_user
      POSTGRES_PASSWORD: chatty_pass
      POSTGRES_DB: chatty_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: chatty_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # Default pgAdmin login email
      PGADMIN_DEFAULT_PASSWORD: admin          # Default pgAdmin login password
    ports:
      - "5051:80"  # Expose pgAdmin on port 5050
    depends_on:
      - postgres   # Ensure pgAdmin starts after PostgreSQL

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chatty_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=False
      - DEBUG=False
      - UPLOAD_DIR=/app/uploads
      - OLLAMA_MODEL=phi3
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      - postgres
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:dev-ollama
    container_name: open-webui
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=9f8c4e2a1b3d5f6a7c8e9d0b1a2c3e4f5d6b7a8c9e0f1d2c3b4a5e6f7d8c9b0
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  uploads_data:
